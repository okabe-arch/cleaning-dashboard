<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>定期清掃 管理ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --bg:#F5F4F0; --surface:#FFFFFF; --surface2:#EEECEA; --surface3:#E4E2DE;
  --border:#DDDBD5; --text:#1C1B18; --text2:#5C5B54; --text3:#6E6C64;
  --c-green:#1A7A2E; --bg-green:#D6F0DC; --bd-green:#6DC97F;
  --c-amber:#8A5200; --bg-amber:#FDECC8; --bd-amber:#F0B429;
  --c-red:#C0181E;   --bg-red:#FDE8E8;   --bd-red:#F07070;
  --c-blue:#14507A;  --bg-blue:#DCEBF7;  --bd-blue:#6BAAD8;
  --c-gray:#5A5955;  --bg-gray:#EBEBEB;  --bd-gray:#C5C4C0;
  --accent:#1A5C28; --accent-fg:#FFFFFF;
  --radius:12px; --radius-sm:8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#131210; --surface:#1D1C1A; --surface2:#272522; --surface3:#332F2B;
    --border:#302E2B; --text:#F0EDE6; --text2:#A8A69E; --text3:#8E8C84;
    --c-green:#5DD97A; --bg-green:#0C2E14; --bd-green:#2A6E3A;
    --c-amber:#F5C144; --bg-amber:#2B1D00; --bd-amber:#8A5200;
    --c-red:#F07878;   --bg-red:#2E0A0A;   --bd-red:#8B2020;
    --c-blue:#7FC0EE;  --bg-blue:#0A1E2E;  --bd-blue:#2A5A80;
    --c-gray:#A09E97;  --bg-gray:#222120;  --bd-gray:#3A3836;
    --accent:#5DD97A; --accent-fg:#0A1F0D;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;
  -webkit-text-size-adjust:100%;}
button{font-family:inherit;}
.mono{font-family:'DM Mono',ui-monospace,monospace;}

/* HEADER */
.topbar{position:sticky;top:0;z-index:100;background:var(--surface);
  box-shadow:0 1px 0 var(--border);}
.hdr{background:var(--surface);padding:env(safe-area-inset-top,0) 0 0;}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;gap:8px;}
.hdr h1{font-size:15px;font-weight:600;letter-spacing:-.3px;}
.hdr-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.sync{display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:5px 11px;font-size:11px;color:var(--text2);white-space:nowrap;cursor:pointer;}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--c-gray);flex-shrink:0;}
.sdot.ok{background:var(--c-green);}
.sdot.busy{background:var(--c-amber);animation:blink .9s infinite;}
.sdot.err{background:var(--c-red);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* MONTH BAR */
.mbar{display:flex;align-items:center;gap:6px;padding:0 16px 10px;}
.mnav{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  width:36px;height:36px;font-size:15px;color:var(--text2);cursor:pointer;flex-shrink:0;}
.mnav:active{background:var(--surface3);}
.msel{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 10px;font-size:16px;font-weight:600;color:var(--text);text-align:center;
  font-family:inherit;appearance:none;-webkit-appearance:none;cursor:pointer;}
.mtoday{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 12px;font-size:12px;color:var(--text2);cursor:pointer;flex-shrink:0;}

/* TABS */
.tabs{display:flex;gap:2px;padding:0 12px;background:var(--surface);
  border-top:1px solid var(--border);overflow-x:auto;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;background:none;border:none;border-bottom:2.5px solid transparent;
  padding:11px 9px;font-size:12.5px;color:var(--text3);cursor:pointer;white-space:nowrap;font-weight:500;}
.tab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600;}
.tab .cnt{display:inline-block;background:var(--c-red);color:#fff;border-radius:9px;
  font-size:10px;padding:1px 5px;margin-left:4px;font-weight:700;vertical-align:1px;}
.pane{display:none;}
.pane.on{display:block;}

/* METRICS */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:12px 16px 4px;}
.metric{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 4px;text-align:center;cursor:pointer;}
.metric-num{font-size:22px;font-weight:700;line-height:1.1;}
.metric-lbl{font-size:11px;color:var(--text2);margin-top:2px;letter-spacing:.1px;}
.metric.on{box-shadow:inset 0 0 0 2px var(--text);}
.m-gr{border-color:var(--bd-green);background:var(--bg-green);}
.m-am{border-color:var(--bd-amber);background:var(--bg-amber);}
.m-rd{border-color:var(--bd-red);background:var(--bg-red);}
.m-bl{border-color:var(--bd-blue);background:var(--bg-blue);}
.m-gy{border-color:var(--bd-gray);background:var(--bg-gray);}

/* ALERTS */
.alerts{padding:8px 16px 0;display:flex;flex-direction:column;gap:6px;}
.alert{display:flex;align-items:flex-start;gap:8px;border-radius:var(--radius-sm);
  padding:9px 12px;font-size:12px;line-height:1.5;font-weight:500;cursor:pointer;text-align:left;
  border:1.5px solid;width:100%;background:none;}
.alert.urg{background:var(--bg-red);color:var(--c-red);border-color:var(--bd-red);}
.alert.wrn{background:var(--bg-amber);color:var(--c-amber);border-color:var(--bd-amber);}
.alert.info{background:var(--bg-blue);color:var(--c-blue);border-color:var(--bd-blue);}

/* FILTERS + BAR */
.filters{display:flex;gap:6px;padding:10px 16px 6px;overflow-x:auto;}
.filters::-webkit-scrollbar{display:none;}
.fbtn{flex-shrink:0;background:var(--surface);border:1.5px solid var(--border);
  border-radius:20px;padding:6px 13px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;}
.fbtn.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.bar{display:flex;gap:7px;padding:4px 16px 10px;flex-wrap:wrap;}
.sbtn{flex:1;min-width:130px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);padding:11px 10px;font-size:13px;color:var(--text2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.sbtn:active{background:var(--surface2);}
.sbtn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600;}
.sbtn.sm{flex:0 0 auto;min-width:0;padding:8px 12px;font-size:12px;}

/* CARDS */
.cards{padding:0 16px calc(env(safe-area-inset-bottom,0px) + 64px);display:flex;flex-direction:column;gap:9px;}
.card{background:var(--surface);border-radius:var(--radius);overflow:hidden;
  border:1.5px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.06);}
.card.lv-red{border-color:var(--bd-red);border-left:4px solid var(--c-red);}
.card.lv-amber{border-color:var(--bd-amber);border-left:4px solid var(--c-amber);}
.card.lv-green{border-color:var(--bd-green);border-left:4px solid var(--c-green);}
.card.lv-blue{border-color:var(--bd-blue);border-left:4px solid var(--c-blue);}
.card.lv-gray{border-left:4px solid var(--bd-gray);}
.card-hdr{display:flex;align-items:flex-start;justify-content:space-between;width:100%;
  padding:12px 13px 11px;cursor:pointer;gap:8px;background:none;border:none;text-align:left;color:inherit;}
.card-hdr:active{background:var(--surface2);}
.prop-name{font-size:14px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;}
.prop-sub{font-size:10.5px;color:var(--text3);margin-top:2px;font-family:'DM Mono',monospace;}
.prop-time{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.4;}
.card-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.badge{display:inline-block;border-radius:20px;padding:4px 9px;font-size:10.5px;
  font-weight:600;white-space:nowrap;border:1px solid;}
.b-gr{background:var(--bg-green);color:var(--c-green);border-color:var(--bd-green);}
.b-am{background:var(--bg-amber);color:var(--c-amber);border-color:var(--bd-amber);}
.b-rd{background:var(--bg-red);color:var(--c-red);border-color:var(--bd-red);}
.b-bl{background:var(--bg-blue);color:var(--c-blue);border-color:var(--bd-blue);}
.b-gy{background:var(--bg-gray);color:var(--c-gray);border-color:var(--bd-gray);}
.chevron{font-size:11px;color:var(--text3);transition:transform .2s;}
.chevron.open{transform:rotate(180deg);}
.card-body{padding:0 13px 13px;display:none;flex-direction:column;gap:10px;}
.card-body.open{display:flex;}
.divider{height:1px;background:var(--border);margin:2px 0 2px;}

/* STEPPER */
.steps{display:flex;gap:3px;}
.step{flex:1;height:5px;border-radius:3px;background:var(--surface3);}
.step.done{background:var(--c-green);}
.step.now{background:var(--c-amber);}
.steplbl{font-size:11px;color:var(--text2);text-align:center;margin-top:-4px;}

.field{display:flex;flex-direction:column;gap:5px;}
.flabel{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.3px;}
.finput{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:16px;color:var(--text);font-family:inherit;width:100%;}
.finput:focus{outline:none;border-color:var(--accent);}
textarea.finput{min-height:110px;resize:vertical;line-height:1.6;font-size:16px;}
.sel-wrap{position:relative;}
.sel-wrap select{appearance:none;-webkit-appearance:none;}
.sel-wrap::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--text3);pointer-events:none;font-size:12px;}
.row2{display:flex;gap:8px;}
.row2>*{flex:1;min-width:0;}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;}
.flabel{overflow-wrap:anywhere;}
.dl-tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:3px 8px;
  font-size:11px;font-weight:600;border:1px solid;}
.dl-over{background:var(--bg-red);color:var(--c-red);border-color:var(--bd-red);}
.dl-soon{background:var(--bg-amber);color:var(--c-amber);border-color:var(--bd-amber);}
.dl-safe{background:var(--bg-green);color:var(--c-green);border-color:var(--bd-green);}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}

/* GENERIC BOXES */
.sect{padding:12px 16px 4px;}
.sect h2{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.sect h2 .hint{font-size:11px;color:var(--text3);font-weight:400;}
.box{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px;}
.box+.box{margin-top:9px;}
.note{font-size:11.5px;color:var(--text2);line-height:1.65;}
.note code{background:var(--surface2);padding:1px 5px;border-radius:4px;font-family:'DM Mono',monospace;font-size:11px;}
.drop{border:2px dashed var(--border);border-radius:var(--radius);padding:18px 12px;text-align:center;
  font-size:12px;color:var(--text3);background:var(--surface2);}
.drop.hot{border-color:var(--accent);color:var(--accent);background:var(--bg-green);}
.empty{text-align:center;color:var(--text3);font-size:12.5px;padding:26px 16px;line-height:1.7;}

/* PARSE RESULT */
.pcard{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);
  padding:11px 12px;display:flex;flex-direction:column;gap:7px;}
.pcard.hi{border-color:var(--bd-green);}
.pcard.lo{border-color:var(--bd-amber);}
.pcard.no{border-color:var(--bd-red);}
.ptop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
.pname{font-size:13.5px;font-weight:600;line-height:1.3;}
.pmeta{font-size:10.5px;color:var(--text3);margin-top:2px;line-height:1.5;word-break:break-all;}
.pdiff{font-size:12px;line-height:1.7;background:var(--surface2);border-radius:6px;padding:8px 10px;}
.pdiff b{color:var(--c-green);}
.pdiff s{color:var(--text2);}
.prow{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:6px;}
.prow .sbtn{min-width:0;padding:9px 8px;font-size:12px;text-align:center;}

/* LOG */
.logitem{display:flex;gap:8px;font-size:11.5px;line-height:1.6;padding:8px 0;
  border-bottom:1px solid var(--border);}
.logitem:last-child{border-bottom:none;}
.logts{color:var(--text3);white-space:nowrap;font-family:'DM Mono',monospace;font-size:10.5px;flex-shrink:0;}
.logsrc{flex-shrink:0;font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--border);
  color:var(--text2);background:var(--surface2);height:fit-content;white-space:nowrap;}
.logsrc.mail{border-color:var(--bd-blue);color:var(--c-blue);background:var(--bg-blue);}
.logsrc.auto{border-color:var(--bd-green);color:var(--c-green);background:var(--bg-green);}

/* MAIL PREVIEW */
pre.mail{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:11px;font-size:12px;line-height:1.75;white-space:pre-wrap;word-break:break-word;
  font-family:inherit;max-height:320px;overflow-y:auto;}
pre.code{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:11px;font-size:10.5px;line-height:1.55;overflow-x:auto;max-height:260px;
  font-family:'DM Mono',ui-monospace,monospace;}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:5px 0;
  border-bottom:1px solid var(--border);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text2);flex-shrink:0;}
.kv .v{text-align:right;word-break:break-all;font-weight:500;}

.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;
  transform:translateX(-50%) translateY(90px);background:var(--text);color:var(--bg);
  border-radius:var(--radius);padding:11px 20px;font-size:13px;max-width:88vw;text-align:center;
  z-index:999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 20px rgba(0,0,0,.25);}
.toast.show{transform:translateX(-50%) translateY(0);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
.banner{margin:10px 16px 0;padding:10px 12px;border-radius:var(--radius-sm);font-size:12px;
  line-height:1.55;border:1.5px solid var(--bd-blue);background:var(--bg-blue);color:var(--c-blue);
  display:flex;gap:8px;align-items:center;justify-content:space-between;}
.banner button{background:var(--c-blue);color:var(--surface);border:none;border-radius:6px;
  padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;}
.pick{max-height:46vh;overflow-y:auto;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface2);padding:4px;margin-top:8px;}
.pick label{display:flex;gap:9px;align-items:center;padding:9px 8px;font-size:13.5px;
  border-bottom:1px solid var(--border);cursor:pointer;}
.pick label:last-child{border-bottom:none;}
.pick input{width:19px;height:19px;flex-shrink:0;accent-color:var(--accent);}
.pick .pc{font-size:10.5px;color:var(--text3);font-family:'DM Mono',monospace;}
.warn-tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:3px 8px;
  font-size:11px;font-weight:600;border:1px solid var(--bd-amber);
  background:var(--bg-amber);color:var(--c-amber);}
.undo{background:var(--surface);border:1.5px solid var(--bd-amber);color:var(--c-amber);
  border-radius:var(--radius-sm);padding:9px 12px;font-size:12px;font-weight:600;cursor:pointer;width:100%;}
.contact-row{display:flex;gap:6px;margin-bottom:6px;}
.contact-row input{flex:1;min-width:0;}
.contact-row button{flex:0 0 auto;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text2);padding:0 12px;cursor:pointer;font-size:15px;}
</style>
</head>
<body>

<div class="topbar">
<div class="hdr">
  <div class="hdr-inner">
    <div>
      <h1>定期美化清掃 管理ボード</h1>
      <div class="hdr-sub" id="hdrsub">株式会社コソド / 喫煙室定期清掃</div>
    </div>
    <button class="sync" id="syncbtn" onclick="pollNow()" title="Gmail連携の状態。押すと取込／設定画面を開きます">
      <span class="sdot" id="sdot"></span><span id="slabel">起動中</span>
    </button>
  </div>
  <div class="mbar">
    <button class="mnav" onclick="shiftMonth(-1)" aria-label="前月">‹</button>
    <select class="msel" id="msel" onchange="setMonth(this.value)"></select>
    <button class="mnav" onclick="shiftMonth(1)" aria-label="翌月">›</button>
    <button class="mtoday" onclick="setMonth(thisMonth())">今月</button>
  </div>
</div>
<div class="tabs" id="tabs"></div>
</div>

<div class="pane on" id="pane-board"></div>
<div class="pane" id="pane-inbox"></div>
<div class="pane" id="pane-outbox"></div>
<div class="pane" id="pane-log"></div>
<div class="pane" id="pane-setup"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   定期美化清掃 管理ボード  —  単一ファイル完結型
   ・月ごと管理（YYYY-MM キー / 6ヶ月サイクル自動繰越）
   ・受信メール → 自動解析 → 自動ステータス更新
   ・送信メール → テンプレート自動生成 → 送信記録で自動進行
   ・Gmail自動連携（Apps Script）でポーリング自動取込
   ═══════════════════════════════════════════════════════════════════ */

const LS_KEY   = "cosodo_cleaning_v5";
const LS_LEGACY = "june_cleaning_v4";
const SCHEMA   = 5;

/* ── 工程定義（実際のメール運用に対応） ───────────────────────── */
const STAGES = [
  {k:0, label:"未着手（事前確認メールを送る）",     short:"未着手",   lv:"gray"},
  {k:1, label:"事前確認 送付済（相手の回答待ち）",   short:"回答待ち", lv:"amber"},
  {k:2, label:"条件回答 受領（日程を決める）",       short:"日程調整", lv:"amber"},
  {k:3, label:"日程打診・作業届 提出済（承認待ち）", short:"承認待ち", lv:"amber"},
  {k:4, label:"承認済・日程確定（作業を実施する）", short:"実施待ち", lv:"blue"},
  {k:5, label:"作業完了（完了報告を送る）",         short:"報告待ち", lv:"amber"},
  {k:6, label:"完了報告 送付済（完了）",             short:"完了",     lv:"green"},
];
const stageOf = k => STAGES[Math.max(0, Math.min(6, k|0))];

/* ── 物件マスタ初期値 ────────────────────────────────────────────
   物件名・THE TOBACCOコード・管理会社（法人名）のみを初期収録。
   担当者名・メールアドレスは意図的に未収録 —
   「連携」タブのGmail自動連携が実際の往来メールから自動登録する。 */
const SEED_PROPS = [
  {n:"新虎安田ビル",            c:"THE TOBACCO SHIMBASHI",        co:"",                    t:"20:00以降（平日/日曜）"},
  {n:"ひばりが丘パルコ",         c:"THE TOBACCO HIBARIGAOKA",      co:"株式会社パルコ",        t:"20:30〜7:30"},

/* ══ ユーティリティ ═══════════════════════════════════════════ */
const ESC = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ESC[c]);

const pad2 = n => String(n).padStart(2, "0");
const thisMonth = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; };
const isMonthKey = m => /^\d{4}-(0[1-9]|1[0-2])$/.test(String(m || ""));
const monthLabel = m => { const [y, mo] = String(m || "").split("-"); return `${esc(y)}年 ${Number(mo) || "?"}月`; };
const addMonths = (m, n) => {
  const [y, mo] = m.split("-").map(Number);
  const d = new Date(y, mo - 1 + n, 1);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
};
const monthOf = iso => (iso || "").slice(0, 7);

/* 日付：ローカル時刻で厳密にパース（UTCずれ回避） */
const parseDate = s => {
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s || "").trim());
  if (!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  if (isNaN(d.getTime())) return null;
  /* 2026-02-31 のような存在しない日付を弾く（Dateは繰り上げてしまう） */
  if (d.getFullYear() !== +m[1] || d.getMonth() !== +m[2]-1 || d.getDate() !== +m[3]) return null;
  return d;
};
const todayD = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const toISO = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const diffDays = d => Math.round((d - todayD()) / 86400000);
const shiftDays = (iso, n) => { const d = parseDate(iso); if (!d) return ""; d.setDate(d.getDate()+n); return toISO(d); };
const WD = ["日","月","火","水","木","金","土"];
const fmtJP = iso => { const d = parseDate(iso); return d ? `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）` : ""; };

function dlStat(iso) {
  const d = parseDate(iso); if (!d) return null;
  const n = diffDays(d);
  if (n < 0)  return { cls:"dl-over", label:`${Math.abs(n)}日超過`, n };
  if (n === 0) return { cls:"dl-over", label:"本日", n };
  if (n <= (DB?.settings?.warnDays ?? 3)) return { cls:"dl-soon", label:`残${n}日`, n };
  return { cls:"dl-safe", label:`残${n}日`, n };
}

/* 照合用の正規化（NFKC・小文字・記号/空白除去） */
function norm(s) {
  return String(s || "").normalize("NFKC").toLowerCase()
    .replace(/[\s　]+/g, "")
    .replace(/[()（）「」【】\[\]・,,.。、~〜～\-ー_/／&＆'"]/g, "");
}

/* 内容全体からの安定ID（FNV-1a 32bit）。先頭一致による衝突を防ぐ */
function hashId(str) {
  let h = 0x811c9dc5;
  const t = String(str);
  for (let i = 0; i < t.length; i++) {
    h ^= t.charCodeAt(i);
    h = (h + (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24)) >>> 0;
  }
  return "p" + h.toString(16).padStart(8, "0") + "-" + (t.length % 100000).toString(36);
}

/* base64url（+ / = を含まないので共有URLが壊れない） */
const b64e = s => btoa(encodeURIComponent(s)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d = s => decodeURIComponent(atob(String(s).replace(/-/g,"+").replace(/_/g,"/")));

/* 旧 june_cleaning_v4 からの移行 */
function migrateLegacy(db) {
  let raw = null;
  try { raw = localStorage.getItem(LS_LEGACY); } catch (e) { return false; }
  if (!raw) return false;
  let old; try { old = JSON.parse(raw); } catch (e) { return false; }
  if (!old || typeof old !== "object") return false;
  const M = db.months["2026-06"] = db.months["2026-06"] || {};
  /* 「OK」は承認そのものではなく「先方と話がついた」程度の意味なので 3（承認待ち）に落とし、
     stage4（日程確定）は status の明示的な承認済からのみ立てる。 */
  const A2S = { "OK":3, "確認中":2, "未確認":1, "NG":1 };
  const S2S = { "事前確認メール送付済み":1, "作業届提出済み":3, "作業届承認済み":4, "作業完了":5 };
  let n = 0;
  Object.keys(old).forEach(k => {
    const id = Number(k); const p = db.props.find(x => x.id === id); if (!p) return;
    const o = old[k] || {};
    const st = Math.max(A2S[o.approval] || 0, S2S[o.status] || 0);
    if (!st && !o.memo && !o.submitDL && !o.confirmDL) return;
    const e = M[id] = newEntry(p);
    e.stage = st; e.workTime = o.time || p.timeNote || "";
    e.submitDL = o.submitDL || ""; e.confirmDL = o.confirmDL || ""; e.memo = o.memo || "";
    n++;
  });
  if (n) db.log.unshift({ ts:new Date().toISOString(), kind:"migrate",
    text:`旧6月ボードから ${n}件を 2026-06 に移行しました`, src:"auto", propId:null, month:"2026-06" });
  return n > 0;
}

/* 保存データと物件マスタの整合（新規物件が消えない） */
function reconcile(db) {
  if (!Array.isArray(db.props)) db.props = [];
  /* 物件名でもコードでも既存判定する。リネーム後にシードが復活して
     同一コードの物件が二重登録されるのを防ぐ。 */
  const haveName = new Set(db.props.map(p => norm(p.name)));
  const haveCode = new Set(db.props.filter(p => p.code).map(p => norm(p.code)));
  SEED_PROPS.forEach(sd => {
    if (haveName.has(norm(sd.n))) return;
    if (sd.c && haveCode.has(norm(sd.c))) return;
    db.props.push(newProp(sd, nextPropIdOf(db)));
  });
  /* id は必ず数値。文字列だと onclick 属性を脱出できてしまう */
  db.props = db.props.filter(p => p && typeof p.name === "string")
    .map((p, i) => Object.assign(p, { id: Number.isInteger(Number(p.id)) && Number(p.id) > 0 ? Number(p.id) : i + 1 }));
  db.props.forEach(p => {
    p.aliases = Array.isArray(p.aliases) ? p.aliases : [];
    p.contacts = Array.isArray(p.contacts) ? p.contacts : [];
    p.cycle = Math.max(1, Math.min(36, Number(p.cycle) || 6));
    if (p.active === undefined) p.active = true;
    ["code","company","entryNote","spots","supplies"].forEach(k => {
      if (typeof p[k] !== "string") p[k] = "";
    });
    p.contacts = p.contacts.filter(c => c && typeof c.email === "string")
      .map(c => ({ name: String(c.name || c.email.split("@")[0]), email: c.email,
                   tel: String(c.tel || ""), active: c.active !== false, seenAt: c.seenAt || "" }));
  });
  db.settings = Object.assign(blankDB().settings, db.settings || {});
  db.sync = Object.assign(blankDB().sync, db.sync || {});
  if (!db.sync.seen || typeof db.sync.seen !== "object") db.sync.seen = {};
  /* 90日より古い取込記録を捨てる。localStorage の上限に達して保存が止まるのを防ぐ */
  const cut = Date.now() - 90 * 86400000;
  const pruned = {};
  Object.keys(db.sync.seen).forEach(k => { if (Number(db.sync.seen[k]) > cut) pruned[k] = db.sync.seen[k]; });
  db.sync.seen = pruned;
  db.months = db.months && typeof db.months === "object" ? db.months : {};
  db.log = Array.isArray(db.log) ? db.log : [];
  db.pending = Array.isArray(db.pending) ? db.pending : [];
  Object.keys(db.months).forEach(m => {
    const M = db.months[m];
    Object.keys(M).forEach(id => {
      const e = M[id] = Object.assign(newEntry(null), M[id]);
      const st = Number(e.stage);
      /* 範囲外の値は 0 に戻す。6 に切り上げると「完了」で固定され復旧できない */
      e.stage = (Number.isInteger(st) && st >= 0 && st <= 6) ? st : 0;
      e.sent = Object.assign({ precheck:"", propose:"", report:"" }, e.sent || {});
      if (e.state !== "postponed" && e.state !== "cancelled") e.state = "active";
    });
  });
  return db;
}
function nextPropIdOf(db) { return db.props.reduce((a,p) => Math.max(a, p.id || 0), 0) + 1; }

async function load() {
  setSync("busy", "読込中");
  let db = null, raw = null, broken = false;
  try { raw = localStorage.getItem(LS_KEY); } catch (e) { raw = null; }
  if (raw) {
    try { db = JSON.parse(raw); }
    catch (e) { broken = true; }
  }
  /* 壊れていたら白紙で上書きせず、原本を退避してから確認する */
  if (broken) {
    try { localStorage.setItem(LS_KEY + "_broken_" + Date.now(), raw); } catch (e) {}
    if (!confirm("保存データを読み込めませんでした。\n原本は退避しました（削除していません）。\n\n白紙の状態で開始しますか？\n「キャンセル」を選ぶとデータを保護したまま停止します。")) {
      setSync("err", "停止中（データ保護）");
      throw new Error("保存データが壊れています。復旧のため起動を中止しました。");
    }
  }
  if (!db || db.schema !== SCHEMA) {
    const fresh = blankDB();
    if (db && db.props) {   // 将来のスキーマ変更に備えた保守的マージ
      try { db = reconcile(Object.assign(fresh, db, { schema: SCHEMA })); }
      catch (e) {
        try { localStorage.setItem(LS_KEY + "_migfail_" + Date.now(), raw || ""); } catch (_) {}
        throw new Error("データの移行に失敗しました。原本は退避済みです。");
      }
    } else {
      db = fresh;
      migrateLegacy(db);
    }
  }
  DB = reconcile(db);

  /* 共有URL（#）からの読込 */
  if (location.hash && location.hash.length > 1) {
    try {
      const pack = await unpackShare(location.hash.slice(1));
      if (pack && pack.months && typeof pack.months === "object") {
        const res = mergeShare(pack);
        if (isMonthKey(pack.current)) DB.current = pack.current;   // 任意文字列を弾く
        DB = reconcile(DB);
        addLog("import", `共有URLから取込：${res.merged}件を反映／${res.skipped}件は古いためスキップ`
          + (res.unknown ? `／${res.unknown}件は物件を特定できず未取込` : ""), "man");
        showToast(`共有データを読み込みました（${res.merged}件反映${res.skipped?`・${res.skipped}件スキップ`:""}）`);
      } else throw new Error("shape");
    } catch (e) {
      showToast("共有URLの読込に失敗しました（リンクが途中で切れている可能性があります）");
    }
    history.replaceState(null, "", location.pathname + location.search);
  }

  ui.pending = Array.isArray(DB.pending) ? DB.pending : [];
  rollForward();
  save(true);
  setSync("ok", "ローカル保存");
  renderAll();
  startPolling();
}

/* ── 6ヶ月サイクルの自動繰越 ───────────────────────────────────
   完了(stage>=5)した案件から、周期後の月へ次回エントリを自動生成。
   すでに存在する場合は触らない（冪等）。 */
function rollForward() {
  let made = 0;
  Object.keys(DB.months).forEach(m => {
    const M = DB.months[m];
    Object.keys(M).forEach(idStr => {
      const id = Number(idStr), e = M[idStr];
      if (e.stage < 5) return;
      if (e._noRoll) return;                       // ユーザーが繰越を削除した場合は再生成しない
      if (e.state === "cancelled") return;         // 中止案件からは繰越しない
      const p = propById(id); if (!p) return;
      let nm = e.autoNext;
      /* autoNext が空・不正・過去を指す場合は 周期から算出し直す */
      if (!isMonthKey(nm) || nm <= m) nm = addMonths(e.workDate ? monthOf(e.workDate) : m, p.cycle);
      if (!isMonthKey(nm) || nm <= m) return;
      const NM = month(nm);
      if (NM[id]) return;
      NM[id] = newEntry(p);
      made++;
      addLog("cycle", `${p.name}：${monthLabel(m)}の完了を受けて ${monthLabel(nm)} に次回案件を自動作成`, "auto", id);
    });
  });
  /* 期限の自動算出（作業日が入っていて期限が空なら埋める） */
  Object.keys(DB.months).forEach(m => {
    const M = DB.months[m];
    Object.keys(M).forEach(idStr => autoDeadlines(M[idStr]));
  });
  if (made) save(true);
  return made;
}
function autoDeadlines(e) {
  if (!e || !e.workDate) return;
  const s = DB.settings;
  if (!e.confirmDL) e.confirmDL = shiftDays(e.workDate, -s.leadPrecheck);
  if (!e.submitDL)  e.submitDL  = shiftDays(e.workDate, -s.leadSubmit);
}

/* ══ メール解析エンジン ═══════════════════════════════════════
   実際の往来メール（事前確認 → 条件回答 → 日程打診/作業届 →
   承認 → 完了報告）の定型文から工程・日程・次回予定を抽出する。 */

/* 引用履歴を落とす（過去の日程を誤検出しないため必須） */
function stripQuote(body) {
  const lines = String(body || "").replace(/\r/g, "").split("\n");
  const out = [];
  for (const l of lines) {
    if (/^\s*>/.test(l)) break;
    if (/^\s*\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日\s*(?:[（(][日月火水木金土][)）])?\s*\d{1,2}\s*[:：]\s*\d{2}/.test(l)) break;
    if (/^\s*\**\s*(From|差出人|Sent|送信日時|元のメッセージ|Original Message)\s*\**\s*[:：]/.test(l)) break;
    if (/^-{5,}\s*(Original Message|元のメッセージ)/.test(l)) break;
    if (/^\s*On\s.+\swrote:\s*$/.test(l)) break;
    out.push(l);
  }
  /* 署名以降を落とす。sig は「署名の開始位置」なので 0 より大きければ切る。
     短文返信（「承知いたしました」＋署名）で署名の建物名を誤って拾わないために重要。 */
  const j = out.join("\n");
  const sig = j.search(/(\n[＿_]{5,}|\n[-=]{2,}\s*\n\s*株式会社|\n\*{10,}|\n[-・=]{10,})/);
  return sig > 0 ? j.slice(0, sig) : j;
}

/* 貼り付けテキストを複数メールに分割 + ヘッダ抽出 */
function splitMails(text) {
  const t = String(text || "").replace(/\r/g, "");
  const hdrRx = /^[ \t]*\**[ \t]*(件名|Subject)[ \t]*\**[ \t]*[:：]/gm;
  const idx = [];
  let m; while ((m = hdrRx.exec(t))) idx.push(m.index);
  let chunks;
  if (idx.length >= 2) {
    chunks = idx.map((s, i) => t.slice(s, idx[i+1] ?? t.length));
    if (idx[0] > 30) chunks.unshift(t.slice(0, idx[0]));
  } else {
    chunks = [t];
  }
  return chunks.map(c => c.trim()).filter(c => c.length > 12).map(parseHeaders);
}
function parseHeaders(chunk) {
  const grab = re => { const m = re.exec(chunk); return m ? m[m.length-1].trim() : ""; };
  const subject = grab(/^[ \t]*\**[ \t]*(?:件名|Subject)[ \t]*\**[ \t]*[:：][ \t]*(.*)$/m);
  const from    = grab(/^[ \t]*\**[ \t]*(?:差出人|From|送信者)[ \t]*\**[ \t]*[:：][ \t]*(.*)$/m);
  const to      = grab(/^[ \t]*\**[ \t]*(?:宛先|To)[ \t]*\**[ \t]*[:：][ \t]*(.*)$/m);
  const cc      = grab(/^[ \t]*\**[ \t]*(?:CC|Cc)[ \t]*\**[ \t]*[:：][ \t]*(.*)$/m);
  const dateRaw = grab(/^[ \t]*\**[ \t]*(?:日付|Date|送信日時)[ \t]*\**[ \t]*[:：][ \t]*(.*)$/m);
  let body = chunk;
  const firstBlank = chunk.search(/\n[ \t]*\n/);
  if (subject && firstBlank > 0) body = chunk.slice(firstBlank);
  return { subject, from, to, cc, date: dateRaw, body, raw: chunk };
}

/* ── 物件照合 ─────────────────────────────────────────────── */
function matchProp(subject, body, from) {
  const hay = norm(subject + " " + body);
  const haySubj = norm(subject);
  let best = null;
  DB.props.forEach(p => {
    /* 1) THE TOBACCO コード（最も強い手掛かり） */
    if (p.code) {
      const c = norm(p.code);
      if (c.length > 6 && hay.includes(c)) {
        /* 長いコードを優先する。THE TOBACCO KINSHICHO ⊂ ...KINSHICHO23、
           THE TOBACCO SHIBUYA ⊂ ...SHIBUYA2~5 のような包含関係で
           配列順に依存して取り違えるのを防ぐ。 */
        const s = 1.0 + Math.min(c.length, 40) / 1000 + (haySubj.includes(c) ? .02 : 0);
        if (!best || s > best.score) best = { p, score: s, by: "コード" };
        return;
      }
    }
    /* 2) 物件名 / 別名（長い一致を優先） */
    const cands = [p.name, ...(p.aliases || [])];
    for (const cand of cands) {
      const c = norm(cand);
      if (c.length < 3) continue;
      if (hay.includes(c)) {
        const s = 0.60 + Math.min(c.length, 20) / 50 + (haySubj.includes(c) ? .12 : 0);
        if (!best || s > best.score) best = { p, score: Math.min(s, 0.99), by: cand === p.name ? "物件名" : "別名" };
      }
    }
  });
  /* 3) 既知の担当者アドレスからの補強 */
  const mail = (/[\w.+-]+@[\w.-]+\.\w+/.exec(from || "") || [""])[0].toLowerCase();
  if (mail) {
    const byMail = DB.props.find(p => (p.contacts || []).some(c => (c.email || "").toLowerCase() === mail));
    if (byMail) {
      /* 同じ担当者が複数物件を担当することが多い（パルコ8物件・野村5物件など）ため、
         本文・件名の一致を上書きしない。一致していれば加点のみ。 */
      if (!best) best = { p: byMail, score: 0.75, by: "担当者アドレス" };
      else if (best.p.id === byMail.id) best.score = Math.min(best.score + 0.05, 1.0);
    }
  }
  return best;
}

/* ── 日程抽出 ─────────────────────────────────────────────── */
const RX_DATE = /(\d{1,2})\s*月\s*(\d{1,2})\s*日/g;
const RX_SPAN = /(\d{1,2})\s*[:：]\s*(\d{2})\s*[~〜～\-–ー]{1,2}\s*(?:翌日?\s*|\d{1,2}\s*月\s*\d{1,2}\s*日\s*[（(]?[日月火水木金土]?[)）]?\s*)?(\d{1,2})\s*[:：]\s*(\d{2})/;

/* 「2026年8月7日(金) 16:22」のような和文日付も基準日として解釈する */
function refDateOf(raw) {
  const t = String(raw || "");
  const m = /(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/.exec(t);
  if (m) { const d = new Date(+m[1], +m[2]-1, +m[3]); if (!isNaN(d.getTime())) return d; }
  const d2 = new Date(t);
  return isNaN(d2.getTime()) ? new Date() : d2;
}
function inferYear(mon, ref) {
  const ry = ref.getFullYear(), rm = ref.getMonth() + 1;
  let y = ry, d = mon - rm;
  /* 6ヶ月周期の業務なので「ちょうど6ヶ月差」は未来側に寄せる */
  if (d <= -6) y = ry + 1;
  else if (d > 6) y = ry - 1;
  return y;
}
function extractDates(text, ref) {
  const found = [], seen = new Set();
  let m, consumedUntil = -1;
  RX_DATE.lastIndex = 0;
  while ((m = RX_DATE.exec(text))) {
    /* 「8月29日（土）23:00~8月30日（日）5:00」の後半日付は
       前半の時間帯表記に含まれるため、独立した候補日として数えない */
    if (m.index < consumedUntil) continue;
    const mo = +m[1], da = +m[2];
    if (mo < 1 || mo > 12 || da < 1 || da > 31) continue;
    const y = inferYear(mo, ref);
    const d = new Date(y, mo - 1, da);
    if (d.getMonth() !== mo - 1) continue;      // 2月31日 等を排除
    /* 直後34文字以内の時間帯を紐付け */
    const tailStart = m.index + m[0].length;
    const tail = text.slice(tailStart, tailStart + 34);
    const sp = RX_SPAN.exec(tail);
    if (sp) consumedUntil = tailStart + sp.index + sp[0].length;
    const iso = toISO(d);
    if (seen.has(iso)) continue;
    seen.add(iso);
    found.push({ iso, time: sp ? `${+sp[1]}:${sp[2]}〜${+sp[3]}:${sp[4]}` : "" });
  }
  return found;
}
function extractNextMonth(text, ref) {
  let m = /次回[^。\n]{0,40}?[【]?\s*(\d{4})\s*年[^0-9]{0,4}(\d{1,2})\s*月/.exec(text);
  if (m) return `${m[1]}-${pad2(+m[2])}`;
  m = /次回[^。\n]{0,40}?[【]?\s*(\d{1,2})\s*月/.exec(text);
  if (m) {
    /* 「次回」は必ず未来。年の記載がなければメール送信月より後になるよう繰り上げる */
    const mo = +m[1];
    if (mo < 1 || mo > 12) return "";
    const y = ref.getFullYear() + (mo <= ref.getMonth() + 1 ? 1 : 0);
    return `${y}-${pad2(mo)}`;
  }
  return "";
}

/* ── 工程判定 ─────────────────────────────────────────────── */
const SIG_OUT = [
  { st:6, re:/予定通り\s*(?:作業を)?実施(?:しました|させていただきました|いたしました)|作業完了報告書|完了報告書を?添付/ , why:"完了報告の送付" },
  { st:3, re:/下記日程で(?:の実施を希望|実施)|下記日程にて|下記スケジュール|作業日時が確定|実施日時が確定|作業日程の調整ができ|日程での実施を希望/, why:"日程打診・作業届提出" },
  { st:3, re:/作業届を?(?:添付|記入|提出)|作業申請書|工事申請書/, why:"作業届の提出" },
  { st:1, re:/【確認事項】|事前に何点かご確認|来月頃に定期美化清掃|定期美化清掃の実施を予定/, why:"事前確認メールの送付" },
];
const SIG_IN = [
  /* 明示的な承認表現。単独でも承認と判定してよい */
  { st:4, re:/申請承認済|承認済(?:みです)?|受理(?:して)?(?:頂き|いただき)|管理組合に受理|作業届の?(?:ご)?提出ありがとう|申請書もご提出いただき/, why:"作業届の承認" },
  /* 「承知しました」等は日本語メールの常套句。日付を伴わなければ承認と見なさない */
  { st:4, needDate:true, fallback:2,
    re:/(?:にて)?承知(?:いた)?しました|問題ございません|問題ありません|で結構です|了承(?:いた)?しました|内容確認(?:致|いた)しました/,
    why:"日程の承諾（日付あり）" },
  { st:2, re:/清掃の実施可能時間|実施可能時間帯|望ましいです|下記日程の中から|ご調整は可能でしょうか|作業届に記入|申請書を(?:お送り|送付)|提出をお願い|リンクをいただけ/, why:"実施条件の回答" },
];

function parseMail(mail) {
  const body = stripQuote(mail.body);
  const text = (mail.subject || "") + "\n" + body;
  const ref = refDateOf(mail.date);

  /* From のアドレス部だけで判定する（表示名によるなりすましを防ぐ） */
  const addr = (/<([^>]+)>/.exec(mail.from || "") || [null, mail.from || ""])[1].trim().toLowerCase();
  const ownRx = new RegExp("@([\\w-]+\\.)*" + OWN_DOMAIN.replace(/\./g, "\\.") + "$", "i");
  const hasHeader = !!(mail.subject || mail.from);
  const outbound = ownRx.test(addr) || (!mail.from && /コソドの|株式会社コソドの/.test(body));
  const dir = outbound ? "out" : "in";

  /* 定期清掃関連メールかどうか */
  const relevant = /定期(?:美化)?清掃|喫煙(?:室|所)|作業届|作業完了報告|清掃作業|作業申請書/.test(text);

  const pm = matchProp(mail.subject, body, mail.from);
  const dates = extractDates(body, ref);
  const sigs = dir === "out" ? SIG_OUT : SIG_IN;
  let stage = -1, why = "";
  for (const sg of sigs) {
    if (!sg.re.test(text)) continue;
    /* 日付を伴わない相槌は一段下の工程として扱う */
    const st = (sg.needDate && dates.length === 0) ? sg.fallback : sg.st;
    if (st > stage) { stage = st; why = (sg.needDate && dates.length === 0) ? "返信あり（承認は未確認）" : sg.why; }
  }

  /* 「承認されておりません」「見送り」「延期」等があれば承認判定を取り下げる */
  if (stage >= 4 && /(?:承認|了承)[^。\n]{0,8}(?:されて|でき)?(?:ておりま|おりま|ま)せん|見送り|中止|延期|再調整|difficult/.test(text)) {
    stage = Math.min(stage, 2); why = "要確認（否定・延期の表現あり）";
  }
  const nextMonth = dir === "out" && stage === 6 ? extractNextMonth(body, ref) : "";

  /* 担当者情報（受信のみ・自社ドメイン以外） */
  const contact = (() => {
    if (dir !== "in") return null;
    const em = (/[\w.+-]+@[\w.-]+\.\w+/.exec(mail.from || "") || [""])[0];
    if (!em || em.toLowerCase().includes(OWN_DOMAIN)) return null;
    let nm = (mail.from || "").replace(/<[^>]*>/g, "").replace(/["']/g, "").trim();
    if (!nm || nm.includes("@")) nm = em.split("@")[0];
    return { name: nm, email: em, tel: "" };
  })();

  /* 確度 */
  let conf = 0;
  if (pm && relevant) {
    conf = Math.min(pm.score, 1) * (stage >= 0 ? 1 : 0.45);
    if (dates.length > 2) conf *= 0.8;   // 候補日の羅列は確定情報ではない
    if (!hasHeader) conf *= 0.5;         // 件名・差出人が無いと送受信の向きが確定できない
  }
  return {
    id: mail.id || hashId((mail.subject || "") + "\u0000" + (mail.date || "") + "\u0000" + body),
    dir, relevant, stage, why, dates, nextMonth, contact, hasHeader,
    dateISO: isNaN(ref.getTime()) ? "" : toISO(ref),
    propId: pm ? pm.p.id : null, propName: pm ? pm.p.name : "", matchBy: pm ? pm.by : "",
    conf: Math.round(conf * 100) / 100,
    subject: mail.subject || "(件名なし)", from: mail.from || "", date: mail.date || "",
    body, snippet: body.replace(/\s+/g, " ").trim().slice(0, 150),
  };
}

/* ── 解析結果 → エントリへの差分 ─────────────────────────── */
function planChanges(r) {
  const ch = [];
  if (!r.propId || r.stage < 0) return ch;
  const p = propById(r.propId);
  /* 対象月：確定日があればその月、なければ現在表示月 */
  const useDate = r.dates.length === 1 ? r.dates[0] : null;
  /* 対象月の決定：①確定日の月 → ②その物件の未完了案件が既にある月 → ③表示月。
     バックグラウンド取込のとき「どの月を開いていたか」で格納先が変わるのを防ぐ。 */
  const tm = useDate ? monthOf(useDate.iso)
    : (Object.keys(DB.months).sort().find(m => DB.months[m][r.propId] && DB.months[m][r.propId].stage < 6)
       || DB.current);
  const e = entry(tm, r.propId, false) || newEntry(p);
  const exists = !!entry(tm, r.propId, false);

  if (!exists) ch.push({ f:"_new", m:tm, from:"", to:`${monthLabel(tm)} に案件を新規作成` });
  if (r.stage > e.stage) ch.push({ f:"stage", m:tm, from:stageOf(e.stage).label, to:stageOf(r.stage).label, v:r.stage });
  /* 確定済みの作業日を、現状より前の工程のメール（古い打診・完了報告の回想）で書き換えない */
  const dateLocked = !!e.workDate && (r.stage >= 6 || r.stage < e.stage);
  if (useDate && useDate.iso !== e.workDate && !dateLocked)
    ch.push({ f:"workDate", m:tm, from:e.workDate || "未定", to:useDate.iso, v:useDate.iso });
  if (useDate && useDate.time && useDate.time !== e.workTime) ch.push({ f:"workTime", m:tm, from:e.workTime || "—", to:useDate.time, v:useDate.time });
  if (r.nextMonth && r.nextMonth !== e.autoNext) ch.push({ f:"autoNext", m:tm, from:e.autoNext || "—", to:r.nextMonth, v:r.nextMonth });
  if (r.contact) {
    const has = (p.contacts || []).some(c => (c.email || "").toLowerCase() === r.contact.email.toLowerCase());
    if (!has) ch.push({ f:"_contact", m:tm, from:"", to:`担当者 ${r.contact.name} <${r.contact.email}> を登録`, v:r.contact });
  }
  return ch.map(c => Object.assign(c, { month: tm }));
}

function applyResult(r, src) {
  const ch = planChanges(r);
  if (!ch.length) return 0;
  const tm = ch[0].month;
  const e = entry(tm, r.propId, true);
  const p = propById(r.propId);
  ch.forEach(c => {
    if (c.f === "_new") return;
    if (c.f === "_contact") { p.contacts.push(c.v); return; }
    e[c.f] = c.v;
    if (c.f === "stage") {
      const mailDay = r.dateISO || toISO(todayD());   // ローカル日付。生ヘッダ文字列を入れない
      if (c.v >= 4 && !e.approvedAt) e.approvedAt = mailDay;
      if (c.v >= 5 && !e.doneAt)     e.doneAt     = e.workDate || mailDay;
    }
  });
  if (!e.workTime) e.workTime = p.timeNote || "";
  e.lastMail = r.id;
  e.lastMailDate = r.dateISO || "";
  touch(e);
  autoDeadlines(e);
  DB.sync.seen[r.id] = Date.now();
  addLog("mail", `${p.name}：${r.dir === "in" ? "受信" : "送信"}メールから${ch.filter(c=>c.f!=="_new"&&c.f!=="_contact").map(c=>c.f==="stage"?`工程→${stageOf(c.v).label}`:c.f==="workDate"?`作業日→${c.to}`:c.f==="workTime"?`時間帯→${c.to}`:`次回→${c.to}`).join(" / ") || "情報"}を自動反映（${r.why||"照合"}・確度${Math.round(r.conf*100)}%）`, src || "mail", r.propId);
  rollForward();
  save();
  return ch.length;
}

/* ══ 描画 ═════════════════════════════════════════════════════ */
const TABS = [
  { k:"board",  l:"ボード" },
  { k:"inbox",  l:"受信取込" },
  { k:"outbox", l:"送信" },
  { k:"log",    l:"ログ" },
  { k:"setup",  l:"物件・連携" },
];
function renderTabs() {
  const pend = ui.pending.filter(r => !r.applied).length;
  const el = document.getElementById("tabs");
  el.setAttribute("role", "tablist");
  el.innerHTML = TABS.map(t =>
    `<button class="tab${ui.tab===t.k?" on":""}" role="tab" aria-selected="${ui.tab===t.k}"
       aria-controls="pane-${t.k}" onclick="setTab('${t.k}')">${esc(t.l)}${
      t.k==="inbox" && pend ? `<span class="cnt" aria-label="未確認 ${pend}件">${pend}</span>` : ""}</button>`).join("");
}
function renderMonthSel() {
  const set = new Set(Object.keys(DB.months));
  set.add(DB.current); set.add(thisMonth());
  for (let i = -3; i <= 9; i++) set.add(addMonths(thisMonth(), i));
  const arr = [...set].filter(m => /^\d{4}-\d{2}$/.test(m)).sort();
  const sel = document.getElementById("msel");
  sel.innerHTML = arr.map(m => {
    const n = Object.keys(DB.months[m] || {}).length;
    return `<option value="${m}"${m===DB.current?" selected":""}>${monthLabel(m)}${n?`（${n}件）`:""}</option>`;
  }).join("");
}

/* 表示レベル：工程 + 期限の緊急度。メトリクスとフィルタが必ず一致するよう
   ひとつの案件はちょうど1つのレベルに属する。 */
function levelOf(id) {
  const e = entry(DB.current, id, false);
  if (!e) return "gray";
  const s = DB.settings;
  if (e.state === "cancelled") return "gray";
  if (e.stage >= 6) return "green";
  /* 矛盾状態：日程確定なのに作業日が空。放置すると全アラートから漏れる */
  if (e.stage === 4 && !e.workDate) return "red";
  if (e.state === "postponed") return "amber";
  if (e.stage === 5) {                       // 作業済み・完了報告が未送付
    const base = e.doneAt || e.workDate;
    return (base && diffDays(parseDate(base)) < -s.leadReport) ? "red" : "amber";
  }
  if (e.stage === 4) {                       // 日程確定
    if (diffDays(parseDate(endDateOf(e))) < 0) return "red";   // 作業日を過ぎて未完了
    return "blue";
  }
  /* 未承認のまま作業日が近い */
  if (e.stage < 4 && e.workDate && diffDays(parseDate(e.workDate)) <= 7) return "red";
  const cd = e.stage < 2 ? dlStat(e.confirmDL) : null;
  const sd = e.stage < 4 ? dlStat(e.submitDL)  : null;
  if ((cd && cd.cls === "dl-over") || (sd && sd.cls === "dl-over")) return "red";
  const soon = (cd && cd.cls === "dl-soon") || (sd && sd.cls === "dl-soon");
  if (e.stage === 0) return soon ? "amber" : "gray";
  return "amber";
}
const LVB = { green:"b-gr", amber:"b-am", red:"b-rd", blue:"b-bl", gray:"b-gy" };
const LVM = { green:"m-gr", amber:"m-am", red:"m-rd", blue:"m-bl", gray:"m-gy" };
const LV_NAME = { red:"要対応", amber:"進行中", blue:"実施待ち", green:"完了", gray:"未着手" };
const driftOf = e => (e.workDate && monthOf(e.workDate) !== DB.current) ? monthOf(e.workDate) : "";
/* 「23:00〜5:00」「23:00〜翌5:00」「23:00〜27:00」は翌日にまたぐ作業 */
function isOvernight(e) {
  const m = /(\d{1,2})\s*[:：]\s*\d{2}\s*[~〜～\-–ー]{1,2}\s*(?:翌日?\s*)?(\d{1,2})\s*[:：]\s*\d{2}/.exec(e.workTime || "");
  if (!m) return /翌/.test(e.workTime || "");
  return Number(m[2]) >= 24 || Number(m[2]) <= Number(m[1]);
}
/* 作業が実際に終わる日（跨日なら翌日） */
const endDateOf = e => e.workDate ? (isOvernight(e) ? shiftDays(e.workDate, 1) : e.workDate) : "";
const STATE_LBL = { active:"", postponed:"延期", cancelled:"中止" };

function curEntries() {
  const M = curRO();
  return Object.keys(M).map(Number).map(id => ({ id, p: propById(id), e: M[id] }))
    .filter(x => x.p)
    .sort((a, b) => {
      const ra = a.e.workDate || "9999", rb = b.e.workDate || "9999";
      if (ra !== rb) return ra < rb ? -1 : 1;
      return a.p.name.localeCompare(b.p.name, "ja");
    });
}
/* 物件がどの月に登録されているかの逆引き */
function monthsOf(id) {
  return Object.keys(DB.months).filter(m => DB.months[m][id]).sort();
}

function renderBoard() {
  const rows = curEntries();
  const c = { red:0, amber:0, blue:0, green:0, gray:0 };
  rows.forEach(r => c[levelOf(r.id)]++);
  const reportWait = rows.filter(r => r.e.stage === 5).length;

  /* メトリクス：タップ後の一覧と件数が必ず一致する */
  const metrics = [
    { k:"red",   l:"要対応" },
    { k:"amber", l:"進行中" },
    { k:"blue",  l:"実施待ち" },
    { k:"gray",  l:"未着手" },
    { k:"green", l:"完了" },
  ].map(m => `<button class="metric ${LVM[m.k]}${ui.filter===m.k?" on":""}" aria-pressed="${ui.filter===m.k}" onclick="setFilter('${m.k}')">
      <div class="metric-num" style="color:var(--c-${m.k})">${c[m.k]}</div>
      <div class="metric-lbl">${esc(m.l)}</div></button>`).join("");

  /* アラート */
  const alerts = [];
  /* 連携が止まっていることに気づけるようにする */
  const stale = syncStale();
  if (stale) alerts.push({ cls:"urg", icon:"🔌", id:0, nolink:true,
    msg:`Gmail連携が${stale.days !== null ? `${stale.days}日以上` : "一度も"}成功していません${stale.err ? `（${stale.err}）` : ""}` });
  /* 同一日に複数物件（作業員・車両の手配衝突） */
  const byDay = {};
  rows.forEach(({ p, e }) => {
    if (e.state === "cancelled" || e.stage >= 5 || !e.workDate) return;
    (byDay[e.workDate] = byDay[e.workDate] || []).push(p.name);
  });
  Object.keys(byDay).sort().forEach(d => {
    if (byDay[d].length < 2) return;
    alerts.push({ cls:"wrn", icon:"👷", id:0, nolink:true,
      msg:`${fmtJP(d)} に ${byDay[d].length}件が重なっています（${byDay[d].slice(0,3).join("・")}${byDay[d].length>3?" ほか":""}）— 作業員・車両の手配をご確認ください` });
  });
  rows.forEach(({ id, p, e }) => {
    if (e.state === "cancelled") return;
    if (e.stage >= 6) return;
    if (e.stage === 5) {
      const base = e.doneAt || e.workDate;
      const n = base ? diffDays(parseDate(base)) : null;
      alerts.push({ cls:(n !== null && n < -DB.settings.leadReport) ? "urg" : "wrn", icon:"📄", id,
        msg:`${p.name}：作業済み・完了報告が未送付${base ? `（作業 ${fmtJP(base)}／${n !== null ? `${Math.abs(n)}日経過` : ""}）` : ""}` });
      return;
    }
    if (e.stage === 4 && !e.workDate) {
      alerts.push({ cls:"urg", icon:"❓", id,
        msg:`${p.name}：日程確定になっていますが作業予定日が未入力です` });
      return;
    }
    if (e.state === "postponed") {
      alerts.push({ cls:"wrn", icon:"⏸", id,
        msg:`${p.name}：延期中${e.stateNote ? `（${e.stateNote}）` : ""} — 再調整が必要です` });
      return;
    }
    /* 未承認のまま作業日が迫っている（最も危険なのでアラート化） */
    if (e.stage < 4 && e.workDate) {
      const n = diffDays(parseDate(e.workDate));
      if (n >= 0 && n <= 7) {
        const wait = e.sent.propose ? -diffDays(parseDate(e.sent.propose)) : null;
        alerts.push({ cls:"urg", icon:"⚠️", id,
          msg:`${p.name}：未承認のまま作業日まで${n === 0 ? "本日" : `${n}日`}${wait !== null ? `（作業届提出から${wait}日 承認待ち）` : ""}` });
        return;
      }
    }
    /* 承認待ちが長引いている */
    if (e.stage === 3 && e.sent.propose) {
      const wait = -diffDays(parseDate(e.sent.propose));
      if (wait >= 7) alerts.push({ cls:"wrn", icon:"📮", id,
        msg:`${p.name}：作業届の提出から${wait}日 承認がありません — 催促をご検討ください` });
    }
    const dm = driftOf(e);
    if (dm) alerts.push({ cls:"info", icon:"📆", id,
      msg:`${p.name}：作業日 ${fmtJP(e.workDate)}（${monthLabel(dm)}）ですが、この案件は ${monthLabel(DB.current)} のボードにあります — カードから移動できます` });
    if (e.stage === 4 && e.workDate) {
      const n = diffDays(parseDate(endDateOf(e)));
      if (n < 0) alerts.push({ cls:"urg", icon:"❗", id,
        msg:`${p.name}：${fmtJP(e.workDate)}の作業日を過ぎています（完了記録が未入力）` });
      else if (n <= 3) alerts.push({ cls:"info", icon:"🧹", id,
        msg:`${p.name}：作業 ${fmtJP(e.workDate)}${isOvernight(e) ? "〜翌日" : ""}${e.workTime ? ` ${e.workTime}` : ""}（${diffDays(parseDate(e.workDate)) <= 0 ? "本日" : `${diffDays(parseDate(e.workDate))}日後`}）${e.crew ? ` / ${e.crew}` : ""}` });
      return;
    }
    const sd = e.stage < 4 ? dlStat(e.submitDL) : null;
    const cd = e.stage < 2 ? dlStat(e.confirmDL) : null;
    if (sd && sd.n <= DB.settings.warnDays) alerts.push({
      cls: sd.n < 0 ? "urg" : "wrn", icon: sd.n < 0 ? "🚨" : "⏰", id,
      msg:`${p.name}：作業届 提出期限 ${fmtJP(e.submitDL)}（${sd.label}）` });
    if (cd && cd.n <= DB.settings.warnDays) alerts.push({
      cls: cd.n < 0 ? "urg" : "wrn", icon: cd.n < 0 ? "🚨" : "⏰", id,
      msg:`${p.name}：事前確認 期限 ${fmtJP(e.confirmDL)}（${cd.label}）` });
  });
  const ORD = { urg:0, wrn:1, info:2 };
  alerts.sort((a, b) => ORD[a.cls] - ORD[b.cls]);
  const shown = alerts.slice(0, 8);

  const filters = [
    { k:"all",    l:`すべて ${rows.length}` },
    { k:"todo",   l:"未完了" },
    { k:"red",    l:`🔴 要対応 ${c.red}` },
    { k:"amber",  l:`🟡 進行中 ${c.amber}` },
    { k:"blue",   l:`🔵 実施待ち ${c.blue}` },
    { k:"report", l:`📄 報告待ち ${reportWait}` },
    { k:"gray",   l:`⬜ 未着手 ${c.gray}` },
    { k:"green",  l:`🟢 完了 ${c.green}` },
  ].map(f => `<button class="fbtn${ui.filter===f.k?" on":""}" aria-pressed="${ui.filter===f.k}"
       onclick="setFilter('${f.k}')">${esc(f.l)}</button>`).join("");

  const shownRows = rows.filter(passFilter);
  const banners = [];
  if (DB.current !== thisMonth()) banners.push(
    `<div class="banner"><span>表示中は ${esc(monthLabel(DB.current))} です（今月は ${esc(monthLabel(thisMonth()))}）</span>
      <button onclick="setMonth(thisMonth())">今月へ</button></div>`);
  const bkDays = DB.lastExportAt ? Math.floor((Date.now() - DB.lastExportAt) / 86400000) : null;
  if (rows.length && (bkDays === null || bkDays >= 14)) banners.push(
    `<div class="banner" style="border-color:var(--bd-amber);background:var(--bg-amber);color:var(--c-amber)">
      <span>${bkDays === null ? "まだバックアップを取っていません" : `バックアップから ${bkDays} 日経過しています`}。
      データはこのブラウザにしか保存されていません。</span>
      <button style="background:var(--c-amber)" onclick="exportJSON()">今すぐ保存</button></div>`);
  /* 初回起動：まだ案件が1件もなく差出人も未設定なら手順を出す */
  const firstRun = !Object.keys(DB.months).some(m => Object.keys(DB.months[m]).length) && !DB.settings.senderName;
  const guide = firstRun ? `<div class="sect" style="padding-top:12px"><div class="box">
      <h2 style="font-size:13.5px;font-weight:600;margin-bottom:7px">はじめに（3ステップ）</h2>
      <div class="note" style="font-size:12.5px">
        物件マスタには <b>${DB.props.length}件</b> が登録済みです。月ごとの案件はこれから作ります。<br><br>
        <b>1.</b> 「＋ 今月の物件を選ぶ」で、${esc(monthLabel(DB.current))}に実施する物件をチェック<br>
        <b>2.</b> 「物件・連携」タブで<b>担当者名</b>を登録（メール文面の署名に使います）<br>
        <b>3.</b> 受け取ったメールを「受信取込」に貼り付ける → 工程・日程が自動で入ります<br><br>
        Gmailと連携すると貼り付けも不要になります（「物件・連携」タブ）。
      </div>
      <div class="prow" style="margin-top:9px">
        <button class="sbtn pri" onclick="togglePicker()">① 今月の物件を選ぶ</button>
        <button class="sbtn" onclick="setTab('setup')">② 担当者名を登録</button>
      </div></div></div>` : "";
  const banner = banners.join("");

  const body = rows.length
    ? (shownRows.length
        ? `<div class="cards">${shownRows.map(cardHTML).join("")}</div>`
        : `<div class="empty">この条件に該当する案件はありません。<br>「すべて」を押すと ${rows.length} 件が表示されます。</div>`)
    : (firstRun
        ? `<div class="empty">上の手順①から始めてください。</div>`
        : `<div class="empty">${esc(monthLabel(DB.current))}の案件はまだありません。<br><br>
            上の「＋ 今月の物件を選ぶ」から登録するか、<br>
            「受信取込」タブにメールを貼り付けると自動で作成されます。<br><br>
            <span style="color:var(--text2)">物件マスタには ${DB.props.length} 件が登録済みです</span></div>`);

  document.getElementById("pane-board").innerHTML = `
    ${banner}
    ${undoBarHTML()}
    ${guide}
    <div class="metrics">${metrics}</div>
    <div class="bar" style="padding:10px 16px 4px">
      <button class="sbtn pri" onclick="togglePicker()">＋ 今月の物件を選ぶ</button>
      <button class="sbtn sm" onclick="copyPrevMonth()">前月の未完了をコピー</button>
      <button class="sbtn sm" onclick="shareURL()">🔗 共有URL</button>
    </div>
    ${ui.picker ? pickerHTML() : ""}
    ${shown.length ? `<div class="alerts">${shown.map(a => a.nolink
      ? `<div class="alert ${a.cls}"><span aria-hidden="true">${a.icon}</span><span>${esc(a.msg)}</span></div>`
      : `<button class="alert ${a.cls}" onclick="jumpTo(${a.id})"><span aria-hidden="true">${a.icon}</span><span>${esc(a.msg)}</span></button>`).join("")}
      ${alerts.length > shown.length ? `<div class="note" style="padding:0 2px">他 ${alerts.length - shown.length} 件</div>` : ""}</div>` : ""}
    ${rows.length ? `<div class="sect" style="padding:10px 16px 0">
      <input class="finput" type="search" id="boardq" value="${esc(ui.q)}" placeholder="🔍 物件名・コードで絞り込み"
        oninput="setQuery(this.value)"></div>` : ""}
    <div class="filters">${filters}</div>
    ${body}`;
}
function passFilter(r) {
  if (ui.q) {
    const q = norm(ui.q);
    const hay = norm(r.p.name + " " + r.p.code + " " + r.p.company + " " + (r.p.aliases || []).join(" "));
    if (!hay.includes(q)) return false;
  }
  if (ui.filter === "all") return true;
  if (ui.filter === "todo") return r.e.stage < 6;
  if (ui.filter === "report") return r.e.stage === 5;
  return levelOf(r.id) === ui.filter;
}

    .sort((a, b) => a.name.localeCompare(b.name, "ja"));
  if (!avail.length) return `<div class="empty" style="padding:16px">該当する物件がありません</div>`;

      <input type="checkbox" value="${p.id}"${ui.pickSel.has(p.id) ? " checked" : ""} onchange="togglePick(${p.id},this.checked)">
      <span>${esc(p.name)}${p.code ? `<span class="pc"> ${esc(p.code)}</span>` : ""}</span>
    </label>`).join("");
}

function renderInbox() {
  const list = ui.pending;

  const cards = list.map((r, i) => ({ r, i })).reverse().map(({ r, i }) => {
    const ch = r.applied ? [] : planChanges(r);

    const diff = r.applied

      <details><summary class="note" style="cursor:pointer">本文を確認</summary>
        <pre class="mail">${esc(r.body.slice(0, 2500))}</pre></details>

  }).join("");

  const hi = list.filter(r => !r.applied && autoOK(r)).length;
  document.getElementById("pane-inbox").innerHTML = `

        <div class="bar" style="padding:9px 0 0">
          <button class="sbtn pri" onclick="analyzePaste()">解析する</button>
          <button class="sbtn sm" onclick="document.getElementById('pastebox').value='';">クリア</button>
        </div>
        <div class="note" style="margin-top:8px">${DB.settings.autoApply
          ? "⚙️ 現在の設定：判定が<b>ほぼ確実</b>なものは解析と同時に<b>自動で反映</b>されます（「元に戻す」で取り消せます）。「物件・連携」タブでOFFにできます。"
          : "⚙️ 現在の設定：自動反映は<b>OFF</b>です。内容を確認して「この内容で反映」を押してください。"}</div>
        <div class="drop" id="dropzone" style="margin-top:9px">📄 .eml / .txt ファイルをここにドロップしても解析します</div>
      </div>
    </div>

      <h2>解析結果 <span class="hint">${list.length}件${hi?` / 高確度 ${hi}件`:""}</span></h2>
      ${hi ? `<div class="bar" style="padding:0 0 9px"><button class="sbtn pri" onclick="applyAllHigh()">高確度の ${hi} 件をまとめて反映</button></div>` : ""}
      ${list.length ? `<div class="cards" style="padding:0 0 40px">${cards}</div>`
        : `<div class="empty">まだ解析結果がありません。<br>上のボックスにメールを貼り付けて「解析する」を押してください。<br><br>
             「物件・連携」タブでGmail自動連携を設定すると、<br>貼り付けなしで自動取込されます。</div>`}

const MAILKIND = [
  /* show: その工程で意味のあるメールだけを出す（工程が進んだ後の①②は隠す） */
  { k:"precheck", l:"① 事前確認",        adv:1, needDate:false, show:e => e.stage <= 1 },
  { k:"propose",  l:"② 日程打診・作業届", adv:3, needDate:true,  show:e => e.stage <= 3 },
  { k:"remind",   l:"催促（承認待ち）",   adv:0, needDate:false, show:e => e.stage === 3 },
  { k:"report",   l:"③ 完了報告",        adv:6, needDate:true,  show:e => e.stage >= 4 },
];
const kindOf = k => MAILKIND.find(m => m.k === k);
function nextKind(e) {
  if (e.stage <= 0) return "precheck";
  if (e.stage <= 2) return "propose";
  if (e.stage === 3) return e.sent.propose ? "remind" : "propose";
  return "report";
}
/* 送信できない理由（なければ空文字） */
function mailBlock(id, kind) {
  const e = entry(DB.current, id, true), K = kindOf(kind);
  if (K.needDate && !e.workDate) return "作業予定日が未入力です";
  return "";
}
function renderOutbox() {
  const rows = curEntries().filter(r => r.e.stage < 6);
  const noSender = !DB.settings.senderName;
  document.getElementById("pane-outbox").innerHTML = `

      <h2>送信メール <span class="hint">送信したら必ず「送信済みにする」を押してください</span></h2>

        📎 <b>作業届・完了報告書の添付は手動</b>でお願いします。<br>
        送信後に「送信済みにする」を押すと工程が自動で進みます。
        ${noSender ? `<div style="color:var(--c-amber);margin-top:7px">⚠️ 差出人（担当者名）が未設定です。文面が「コソドの担当」になります →
          <button class="sbtn sm" style="display:inline-flex;margin-top:5px" onclick="setTab('setup')">設定する</button></div>` : ""}
      </div>
    </div>
    ${rows.length ? rows.map(({ id, p, e }) => {
      const k = nextKind(e);
      const avail = MAILKIND.filter(m => m.show(e));
      /* 記録は「まだ記録していない種類」だけ出す（誤操作で日付を上書きしない） */

          <div class="pname">${esc(p.name)}</div>

          ${blk ? `<div class="note" style="color:var(--c-amber);margin-top:7px">⚠️ ${esc(blk)}（このまま送ると文面が「（作業日未定）」になります）</div>` : ""}
          <div class="prow" style="margin-top:9px">
            ${avail.map(m => `<button class="sbtn${m.k===k?" pri":""}" onclick="openMail(${id},'${m.k}')">${esc(m.l)}</button>`).join("")}
          </div>
          ${markable.length ? `<div class="prow" style="margin-top:6px">
            ${markable.map(m => `<button class="sbtn" onclick="markSent(${id},'${m.k}')">✅ ${esc(m.l)}を送信済みに</button>`).join("")}
          </div>` : ""}
          ${(e.sent.precheck || e.sent.propose || e.sent.report || e.remindAt) ? `<div class="note" style="margin-top:6px">
            送信記録：${[e.sent.precheck && `①${e.sent.precheck}`, e.sent.propose && `②${e.sent.propose}`,
              e.remindAt && `催促${e.remindAt}`, e.sent.report && `③${e.sent.report}`].filter(Boolean).map(esc).join(" ／ ")}
          </div>` : ""}
          <div class="prow" style="margin-top:6px">
            <button class="sbtn" onclick="copyMail(${id},'${k}')">本文をコピー</button>
            <button class="sbtn" onclick="togglePreview(${id})">文面を見る</button>
          </div>
          <pre class="mail" id="prev-${id}" style="display:none;margin-top:8px">${esc(t.su)}\n\n${esc(t.body)}</pre>
        </div></div>`;
    }).join("") : `<div class="empty">${esc(monthLabel(DB.current))}に送信対象の案件はありません。<br>
        「ボード」タブで今月の物件を登録してください。</div>`}
    <div style="height:60px"></div>`;

/* テキスト系：再描画しない */
function updSoft(id, f, v) {

  save(); softRender();
}
/* 日付・選択系：全面再描画してよい（コミット時にblurしている） */
function updHard(id, f, v) {
  const e = entry(DB.current, id, true); e[f] = v; touch(e);
  /* 期限の再計算は作業届の提出前だけ。提出後に日程を動かしても
     済んだ期限が未来に戻ってボードが逆行しないようにする。 */
  if (f === "workDate") {
    if (e.stage < 3) { e.confirmDL = ""; e.submitDL = ""; }
    autoDeadlines(e);
  }
  addLog("edit", `${propById(id).name}：${FLD[f]||f} を ${v || "未設定"} に手動更新`, "man", id);
  rollForward(); save(); renderBoard(); renderMonthSel();
}
function setEntryState(id, v) {
  const e = entry(DB.current, id, true), p = propById(id);
  e.state = (v === "postponed" || v === "cancelled") ? v : "active";
  touch(e);
  addLog("edit", `${p.name}：案件の状態を「${STATE_LBL[e.state] || "通常"}」に変更`, "man", id);
  save(); renderBoard();
}
function setStage(id, v) {
  const e = entry(DB.current, id, true), n = Number(v) || 0, p = propById(id);
  e.stage = n; touch(e);
  if (n >= 4 && !e.approvedAt) e.approvedAt = toISO(todayD());
  if (n >= 5 && !e.doneAt) e.doneAt = e.workDate || toISO(todayD());
  if (n >= 5 && !e.autoNext) e.autoNext = addMonths(monthOf(e.workDate) || DB.current, p.cycle);
  addLog("edit", `${p.name}：工程を「${stageOf(n).label}」に手動変更`, "man", id);
  rollForward(); save(); renderAll();
}
function advance(id) {
  const e = entry(DB.current, id, true);
  if (e.stage >= 6) return;
  setStage(id, e.stage + 1);
}
function moveEntry(id, toMonth) {
  const e = cur()[id]; if (!e) return;
  const p = propById(id);

  month(toMonth)[id] = e;
  delete cur()[id];
  addLog("edit", `${p.name}：案件を ${monthLabel(DB.current)} から ${monthLabel(toMonth)} へ移動`, "man", id);

function copyPrevMonth() {

/* ── 受信取込 ────────────────────────────────────────────────── */
/* 自動反映の可否。
   工程5以上（作業完了・完了報告済）は実施と請求の根拠になるため、
   自社の送信済みメールであるとGmail側で確認できた場合のみ自動反映する。 */
const AUTO_CONF = 0.85;
function autoOK(r) {
  if (!DB.settings.autoApply) return false;
  if (!r.propId || r.stage < 0) return false;
  if (r.conf < AUTO_CONF) return false;
  if (!r.hasHeader) return false;
  if (r.stage >= 5 && r.verifiedSent !== true) return false;
  return planChanges(r).length > 0;
}
function ingest(text, src) {
  const mails = splitMails(text);
  if (!mails.length) { showToast("解析できるテキストがありません"); return 0; }
  let added = 0, auto = 0;
  mails.forEach(m => {
    const r = parseMail(m);
    if (!r.relevant && !r.propId) return;
    if (ui.pending.some(x => x.id === r.id)) return;
    if (DB.sync.seen[r.id]) return;
    r.applied = false;
    if (autoOK(r)) {
      snapshot(`${r.propName} の自動反映`);
      if (applyResult(r, src || "mail")) { r.applied = true; auto++; }
    }
    ui.pending.push(r); added++;
  });
  /* 古い方から捨てる（新しいメールを残す） */
  if (ui.pending.length > 60) ui.pending.splice(0, ui.pending.length - 60);
  if (!added) showToast("新しい定期清掃メールは見つかりませんでした");
  else if (auto) showToast(`${added}件を解析／${auto}件を自動反映しました`);
  else showToast(`${added}件を解析しました。内容を確認して反映してください`);
  return added;
}
function analyzePaste() {
  const t = document.getElementById("pastebox").value;
  if (!t.trim()) return showToast("メール本文を貼り付けてください");
  ingest(t, "mail");
  renderAll();
}
function applyOne(i) {
  const r = ui.pending[i]; if (!r || r.applied) return;
  snapshot(`${r.propName || "1件"} の反映`);
  if (!applyResult(r, "mail")) { ui.undo = null; return showToast("反映する変更点がありません"); }
  r.applied = true; renderAll(); showToast("反映しました（元に戻せます）");
}
function applyAllHigh() {
  const targets = ui.pending.filter(r => !r.applied && autoOK(r));
  if (!targets.length) return showToast("反映する変更点がありません");
  if (!confirm(`次の ${targets.length} 件を反映します。\n\n` +
      targets.slice(0, 10).map(r => `・${r.propName}：${stageOf(r.stage).short}`).join("\n") +
      (targets.length > 10 ? `\n・ほか ${targets.length - 10}件` : "") +
      "\n\nあとで「元に戻す」で取り消せます。")) return;
  snapshot(`${targets.length}件の一括反映`);
  let n = 0;
  targets.forEach(r => { if (applyResult(r, "mail")) { r.applied = true; n++; } });
  renderAll(); showToast(n ? `${n}件を反映しました（元に戻せます）` : "反映する変更点がありません");
}
function dismissOne(i) {
  const r = ui.pending[i];
  if (r) DB.sync.seen[r.id] = Date.now();   // 無視したものは再取込しない
  ui.pending.splice(i, 1);
  save(); renderAll();
}
function propOptionsHTML(sel) {
  return DB.props.slice().sort((a, b) => a.name.localeCompare(b.name, "ja"))
    .map(p => `<option value="${p.id}"${sel === p.id ? " selected" : ""}>${esc(p.name)}${p.code ? ` (${esc(p.code)})` : ""}</option>`).join("");
}
function setPendProp(i, v) {
  const r = ui.pending[i], p = propById(Number(v));
  if (!r || !p) return;
  r.propId = p.id; r.propName = p.name; r.matchBy = "手動指定";
  r.conf = Math.max(r.conf, 0.9);
  /* 件名の呼び方を別名として学習させる */
  const key = (String(r.subject).match(/【[^】]*】\s*(.{2,20}?)(?:内|の|喫煙|定期|、|，)/) || [])[1];

/* ── Gmail 自動連携（Apps Script のJSONをポーリング） ─────────── */
function setSyncUrl(v) {
  DB.sync.url = String(v || "").trim();
  addLog("edit", DB.sync.url ? "Gmail連携URLを設定しました" : "Gmail連携URLを解除しました", "man");

}
function setSyncAuto(v) { DB.sync.auto = v === "1"; save(); startPolling(); }
function setSyncInterval(v) { DB.sync.intervalMin = Math.max(1, Math.min(120, Number(v) || 5)); save(); startPolling(); }
function resetSeen() {
  if (!confirm(`取込済みの記録を消去します。次回の取込で過去120日分のメールを再解析します。${
    DB.settings.autoApply ? "\n\n⚠️ 自動反映がONのため、過去120日分が再度自動で反映されます。\n先に自動反映をOFFにすることを推奨します。" : ""}`)) return;
  DB.sync.seen = {}; save(); showToast("記録をリセットしました");
}
function startPolling() {
  clearInterval(pollTimer);
  if (!DB.sync.url || !DB.sync.auto) { if (!DB.sync.url) setSync("", "ローカル保存"); return; }
  /* 連続失敗時は間隔を指数的に延ばす（最大60分） */
  const back = Math.min(Math.pow(2, Math.min(DB.sync.failCount || 0, 5)), 12);
  const min = Math.min(60, Math.max(1, DB.sync.intervalMin) * back);
  pollTimer = setInterval(pollNow, min * 60000);
}
async function pollNow() {
  if (!DB.sync.url) {
    if (ui.tab !== "setup") { setTab("setup"); showToast("「物件・連携」タブでGmail連携を設定できます"); }
    return;
  }
  setSync("busy", "取込中…");
  DB.sync.lastPoll = Date.now();
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), 20000);
  try {
    const u = DB.sync.url + (DB.sync.url.includes("?") ? "&" : "?") + "days=120&t=" + Date.now();
    const res = await fetch(u, { method:"GET", redirect:"follow", credentials:"omit", signal: ctl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch (e) { throw new Error("JSONが返っていません（ログイン画面が返っている可能性があります。デプロイのアクセス設定をご確認ください）"); }
    if (data && data.ok === false) throw new Error("Apps Script側エラー：" + (data.error || "不明"));
    if (!data || !Array.isArray(data.events)) throw new Error("形式が想定と異なります");

    /* 古い順に処理する。新しい情報を後勝ちで残すため。 */
    const evs = data.events.slice().sort((a, b) => String(a.date) < String(b.date) ? -1 : 1);
    let added = 0, auto = 0, snapped = false;
    evs.forEach(ev => {
      if (!ev || !ev.id) return;
      if (DB.sync.seen[ev.id]) return;
      const r = parseMail({ id:ev.id, subject:ev.subject, from:ev.from, to:ev.to, cc:ev.cc,
                            date:ev.date, body:ev.body, raw:ev.body });
      r.verifiedSent = ev.sent === true;      // Gmailの送信済みラベルで確認済み
      r.attachments = Array.isArray(ev.attachments) ? ev.attachments : [];
      if (!r.relevant) { DB.sync.seen[ev.id] = Date.now(); return; }
      if (ui.pending.some(x => x.id === r.id)) return;
      r.applied = false;
      /* 自動反映しなかったものは seen に入れない（未確認のまま消えるのを防ぐ） */
      if (autoOK(r)) {
        if (!snapped) { snapshot("Gmail連携の自動反映"); snapped = true; }
        if (applyResult(r, "sync")) { r.applied = true; auto++; }
      }
      ui.pending.push(r); added++;
    });
    if (ui.pending.length > 60) ui.pending.splice(0, ui.pending.length - 60);
    DB.sync.lastOk = Date.now();
    DB.sync.failCount = 0;
    DB.sync.lastError = "";
    save(true);
    setSync("ok", auto ? `自動更新 ${auto}件` : added ? `未確認 ${added}件` : "最新です");
    if (added) { addLog("sync", `Gmail連携：${added}件を取込（自動反映 ${auto}件）`, "sync"); renderAll(); }
    else renderTabs();
  } catch (err) {
    DB.sync.failCount = (DB.sync.failCount || 0) + 1;
    DB.sync.lastError = err.name === "AbortError" ? "20秒でタイムアウトしました" : String(err.message || err);
    save(true);
    setSync("err", `連携エラー（${DB.sync.failCount}回）`);
    console.warn("[sync]", err);
    if (ui.tab === "setup") showToast("取込に失敗：" + DB.sync.lastError);
    startPolling();     // 連続失敗に応じて間隔を延ばす
    renderTabs();
  } finally {
    clearTimeout(to);
  }
}
/* 連携が何日も止まっていることに気づけるようにする */
function syncStale() {
  if (!DB.sync.url) return null;
  const last = DB.sync.lastOk || 0;
  if (!last) return { days: null, err: DB.sync.lastError };
  const h = (Date.now() - last) / 3600000;
  return h > 24 ? { days: Math.floor(h / 24), err: DB.sync.lastError } : null;
}

function propByKey(k) {

function mergeShare(pack) {
  let merged = 0, skipped = 0, unknown = 0;
  Object.keys(pack.months).forEach(m => {
    if (!isMonthKey(m)) return;                       // __proto__ 等を弾く
    const src = pack.months[m];
    if (!src || typeof src !== "object") return;
    Object.keys(src).forEach(k => {
      const inc = src[k];
      if (!inc || typeof inc !== "object") return;
      const p = (typeof inc._key === "string" ? propByKey(inc._key) : null) || propById(Number(k));
      if (!p) { unknown++; return; }
      const M = month(m);
      const mine = M[p.id];
      if (!mine) { M[p.id] = sanitizeEntry(inc, p); merged++; return; }
      /* 更新時刻が新しい側を採用（フィールド単位） */
      if ((inc.updatedAt || "") <= (mine.updatedAt || "")) { skipped++; return; }
      M[p.id] = Object.assign(mine, sanitizeEntry(inc, p));
      merged++;
    });
  });
  return { merged, skipped, unknown };
}
function sanitizeEntry(o, p) {
  const e = newEntry(p);

   "remindAt","crew","updatedAt","state","stateNote"].forEach(k => {

/* 共有URL：deflate 圧縮でチャットに貼れる長さに収める */
async function packShare() {
  const M = curRO(), out = {};
  Object.keys(M).forEach(id => {
    const p = propById(Number(id)); if (!p) return;
    out[id] = Object.assign({}, M[id], { _key: propKey(p) });
  });
  const json = JSON.stringify({ v: 1, current: DB.current, months: { [DB.current]: out } });
  if (typeof CompressionStream === "function") {
    try {
      const cs = new CompressionStream("deflate-raw");
      const w = cs.writable.getWriter();
      w.write(new TextEncoder().encode(json)); w.close();
      const buf = new Uint8Array(await new Response(cs.readable).arrayBuffer());
      let bin = ""; buf.forEach(b => bin += String.fromCharCode(b));
      return "z" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    } catch (e) { /* 非対応環境は無圧縮へ */ }
  }
  return "p" + b64e(json);
}
async function unpackShare(hash) {
  const h = String(hash || "");
  if (h[0] === "z") {
    const bin = atob(h.slice(1).replace(/-/g, "+").replace(/_/g, "/"));
    const buf = Uint8Array.from(bin, c => c.charCodeAt(0));
    const ds = new DecompressionStream("deflate-raw");
    const w = ds.writable.getWriter();
    w.write(buf); w.close();
    return JSON.parse(new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()));
  }
  return JSON.parse(b64d(h[0] === "p" ? h.slice(1) : h));   // 旧形式も読める
}

/* ── ドラッグ&ドロップ ───────────────────────────────────────── */
function wireDrop() {
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  ["dragenter","dragover","dragleave","drop"].forEach(ev => {
    document.addEventListener(ev, e => {
      const dz = document.getElementById("dropzone");
      if (!dz) return;
      stop(e);
      dz.classList.toggle("hot", ev === "dragenter" || ev === "dragover");
      if (ev === "drop") {
        const files = [...(e.dataTransfer?.files || [])];
        if (!files.length) return;
        let pending = files.length, buf = [];
        files.forEach(f => {
          const fr = new FileReader();
          fr.onload = () => { buf.push(String(fr.result)); if (!--pending) { ingest(buf.join("\n\n件名: \n"), "mail"); renderAll(); } };
          fr.onerror = () => { if (!--pending) { if (buf.length) ingest(buf.join("\n"), "mail"); renderAll(); } };
          fr.readAsText(f, "UTF-8");
        });
      }
    }, false);
  });
}

      `<div class="empty">起動に失敗しました：${esc(e.message)}<br>ページを再読み込みしてください。データは保護されています。</div>`;
    setSync("err", "起動エラー");
    /* 壊れた状態で操作させない */
    document.querySelectorAll(".hdr button, .tabs button").forEach(b => b.disabled = true);
  });
  wireDrop();
  const flush = () => {
    clearTimeout(saveTimer);
    if (!DB) return;
    try {
      DB.pending = ui.pending.slice(0, 30).map(r => Object.assign({}, r, { body: String(r.body || "").slice(0, 1800) }));
      localStorage.setItem(LS_KEY, JSON.stringify(DB));
    } catch (e) {}
  };
  window.addEventListener("pagehide", flush);
  document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && DB?.sync?.url && DB.sync.auto &&
        Date.now() - (DB.sync.lastPoll || 0) > DB.sync.intervalMin * 60000) pollNow();
  });
});
</script>

<script type="text/plain" id="gassrc">
/**
 * 定期美化清掃 管理ボード — Gmail 連携（読み取り専用）
 * ============================================================
 * このスクリプトは Gmail を「読む」だけです。
 * メールの送信・削除・変更・下書き作成は一切行いません。
 *
 * ■ セットアップ
 *  1. 下の SHARED_KEY を、推測できない長い文字列に必ず書き換えてください。
 *     （例：ブラウザのアドレス欄で about:blank を開き、適当な英数字を32文字以上）
 *  2. script.google.com で新規プロジェクトを作成し、このコードを貼り付けて保存
 *  3. 「デプロイ」→「新しいデプロイ」→ 種類「ウェブアプリ」
 *       実行ユーザー          ：自分
 *       アクセスできるユーザー：全員
 *     ※「自分のみ」ではブラウザから取得できません（Cookieを送らないため）。
 *       代わりに下の SHARED_KEY で保護します。
 *  4. 発行された URL の末尾に ?key=（1で決めた文字列）を付けて、
 *     管理ボードの「連携URL」に貼り付けてください。
 *     例： https://script.google.com/macros/s/XXXX/exec?key=あなたのキー
 *
 * ■ 重要な注意
 *  ・この URL とキーを知っている人は、対象メールの件名・本文・宛先を読めます。
 *    URL は社外に共有しないでください。スクリーンショットにも写さないように。
 *  ・キーを変えたいときは SHARED_KEY を書き換えて再デプロイし、
 *    管理ボード側の連携URLも更新してください。
 */

// ★ここを必ず書き換えてください（32文字以上を推奨）
var SHARED_KEY = 'CHANGE-ME-32文字以上のランダムな文字列に置き換えてください';

// 監視対象。Gmailのラベル「清掃日程」＋定期清掃キーワード
var LABEL = '清掃日程';
var KEYWORDS = '(定期美化清掃 OR 定期清掃 OR 作業届 OR 作業完了報告書 OR 喫煙室 OR 喫煙所)';
// ラベルの付いたメールだけを対象にしたい場合は true にしてください
// （漏洩範囲は狭くなりますが、ラベルの付け忘れは取りこぼします）
var LABEL_ONLY = false;

var MAX_THREADS = 120;
var BODY_LIMIT = 4000;

function doGet(e) {
  var key = (e && e.parameter && e.parameter.key) || '';
  if (!SHARED_KEY || SHARED_KEY.indexOf('CHANGE-ME') === 0) {
    return json({ ok: false, error: 'SHARED_KEY が初期値のままです。スクリプトを書き換えてください。' });
  }
  if (key !== SHARED_KEY) {
    return json({ ok: false, error: 'key が一致しません。連携URLの ?key= を確認してください。' });
  }
  var days = 120;
  if (e && e.parameter && e.parameter.days) {
    days = Math.max(1, Math.min(400, parseInt(e.parameter.days, 10) || 120));
  }
  try {
    return json({ ok: true, generatedAt: new Date().toISOString(), days: days, events: collectEvents(days) });
  } catch (err) {
    return json({ ok: false, error: String(err) });
  }
}

function json(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

function collectEvents(days) {
  var base = LABEL_ONLY ? 'label:"' + LABEL + '"' : '(label:"' + LABEL + '" OR ' + KEYWORDS + ')';
  var query = base + ' newer_than:' + days + 'd -in:spam -in:trash';

  // 自分が実際に送信したメールのIDを集める。
  // 表示名だけを偽装した「自社を装う受信メール」と区別するために使う。
  var sentIds = {};
  try {
    var sentThreads = GmailApp.search(base + ' newer_than:' + days + 'd in:sent', 0, MAX_THREADS);
    for (var a = 0; a < sentThreads.length; a++) {
      var sm = sentThreads[a].getMessages();
      for (var b = 0; b < sm.length; b++) {
        var labels = ('' + sm[b].getFrom());
        sentIds[sm[b].getId()] = true;
      }
    }
  } catch (e2) { /* 取得できなくても続行（sent:false になるだけ） */ }

  var threads = GmailApp.search(query, 0, MAX_THREADS);
  var events = [];
  for (var i = 0; i < threads.length; i++) {
    var msgs = threads[i].getMessages();
    for (var j = 0; j < msgs.length; j++) {
      var m = msgs[j];
      events.push({
        id: m.getId(),
        threadId: threads[i].getId(),
        date: m.getDate().toISOString(),
        from: m.getFrom(),
        to: m.getTo(),
        cc: m.getCc(),
        subject: m.getSubject(),
        sent: sentIds[m.getId()] === true,
        body: stripQuoted(m.getPlainBody()).slice(0, BODY_LIMIT),
        attachments: m.getAttachments({ includeInlineImages: false })
                      .map(function (x) { return x.getName(); })
      });
    }
  }
  events.sort(function (x, y) { return x.date < y.date ? 1 : -1; });
  return events;
}

// 引用履歴を落とす（過去の日程を誤検出させないため）
function stripQuoted(body) {
  var lines = String(body || '').replace(/\r/g, '').split('\n');
  var out = [];
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    if (/^\s*>/.test(l)) break;
    if (/^\s*\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日\s*(?:[（(][日月火水木金土][)）])?\s*\d{1,2}\s*[:：]\s*\d{2}/.test(l)) break;
    if (/^\s*\**\s*(From|差出人|Sent|送信日時)\s*\**\s*[:：]/.test(l)) break;
    if (/^-{5,}\s*(Original Message|元のメッセージ)/.test(l)) break;
    out.push(l);
  }
  return out.join('\n');
}

// 動作確認用：エディタでこの関数を実行すると件数がログに出ます
function testCollect() {
  var ev = collectEvents(60);
  Logger.log('events: ' + ev.length);
  if (ev.length) Logger.log(JSON.stringify(ev[0], null, 2));
}
</script>
